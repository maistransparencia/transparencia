name: "transparencia"
version: "1.0.0"
config-version: 2

profile: "transparencia"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


on-run-start:
  - "CREATE EXTENSION IF NOT EXISTS unaccent;"
  - "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
  - "CREATE SCHEMA IF NOT EXISTS analytics;"
  - "CREATE OR REPLACE FUNCTION analytics.unaccent(text) RETURNS text LANGUAGE sql IMMUTABLE PARALLEL SAFE AS $$ SELECT public.unaccent($1); $$;"
  - "CREATE OR REPLACE FUNCTION analytics.unaccent(regdictionary, text) RETURNS text LANGUAGE sql IMMUTABLE PARALLEL SAFE AS $$ SELECT public.unaccent($1, $2); $$;"

vars:
  test_mode: false
  administracao_reference_year: 2025
  administracao_min_valid_year: 2000
  ano_inicial_historico: 2021

seeds:
  transparencia:
    +schema: analytics

models:
  transparencia:
    +schema: analytics
    staging:
      +materialized: view
    intermediate:
      +materialized: "{{ 'view' if var('test_mode', false) else 'table' }}"
      # consolidacoes simples (union all + tag de tenant): sem custo de materializar
      int_contratos_consolidados:
        +materialized: view
      int_despesas_fornecedor_consolidadas:
        +materialized: view
      int_despesas_orgao_consolidadas:
        +materialized: view
      int_despesas_unidade_consolidadas:
        +materialized: view
      int_diarias_consolidadas:
        +materialized: view
      int_emendas_consolidadas:
        +materialized: view
      int_siconfi_msc_patrimonial_consolidada:
        +materialized: view
      int_transferencias_consolidadas:
        +materialized: view
    marts:
      # marts sao tabelas: o fixture de packages/db so contem tabelas (db/fixture/dump) e uma view aqui
      # dependeria de intermediarias que nao entram no dump
      +materialized: "{{ 'view' if var('test_mode', false) else 'table' }}"
