version: 2

models:
  - name: fct_receitas
    description: "Fato de receitas consolidadas (orçamentária, união e estado) de todos os portais"
    config:
      contract:
        enforced: true
    tests:
      - receitas_folhas_conciliam_com_topo:
          config:
            severity: warn
    columns:
      - name: receita_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | ano | empresa_id | tipo_receita | codigo)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2015
                max_value: 2035
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
      - name: tipo_receita
        data_type: text
        description: "'orcamentaria', 'uniao', 'estado' ou 'extra_orcamentaria'"
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['orcamentaria', 'uniao', 'estado', 'extra_orcamentaria']
      - name: codigo
        data_type: text
      - name: descricao
        data_type: text
      - name: codigo_fonte_stn
        data_type: text
        description: "Código da fonte STN somente com dígitos (ex.: '1553'; legado '11230000'). Nulo quando o código de receita não traz fonte ou traz mais de uma."
      - name: previsao_atualizada
        data_type: numeric(15, 2)
      - name: arrecadado
        data_type: numeric(15, 2)
