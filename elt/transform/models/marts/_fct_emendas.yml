version: 2

models:
  - name: fct_emendas
    description: "Fato de emendas parlamentares consolidadas de todos os portais"
    config:
      contract:
        enforced: true
    columns:
      - name: emenda_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | ano | empresa_id | numero_emenda)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2015
                max_value: 2035
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
      - name: numero_emenda
        data_type: text
      - name: resumo
        data_type: text
      - name: valor_total
        data_type: numeric(15, 2)
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "valor_total is not null"
      - name: empenhado
        data_type: numeric(15, 2)
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "empenhado is not null"
      - name: autor
        data_type: text
      - name: tipo_emenda
        data_type: text
      - name: esfera_origem
        data_type: text
      - name: ato_normativo
        data_type: text
      - name: destinacao
        data_type: text
      - name: valor_recebido_fundo
        data_type: numeric(15, 2)
        constraints:
          - type: not_null
        description: "Valor da emenda quando confirmada na receita pelo número da proposta; zero nos demais casos"
        tests:
          - not_null
      - name: recebimento_fundo
        data_type: text
        constraints:
          - type: not_null
        description: "confirmado_por_proposta (valor e número da proposta na descrição da receita), valor_igual (só o valor coincide, pode ser coincidência) ou nao_identificado"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["confirmado_por_proposta", "valor_igual", "nao_identificado"]
      - name: receita_codigo
        data_type: text
        description: "Código da linha de receita correspondente (confirmada ou de mesmo valor); nulo quando não identificada"
      - name: receita_descricao
        data_type: text
        description: "Descrição da linha de receita correspondente; nulo quando não identificada"

unit_tests:
  - name: test_emendas_recebimento_fundo
    description: "Confirma pelo número da proposta, trata valor igual como indício e respeita o limite de linhas de receita e o isolamento por portal"
    model: fct_emendas
    given:
      - input: ref('int_emendas_consolidadas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759632202600", resumo: "EMENDA A", valor_total: 2031183.00, empenhado: 0 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "11", resumo: "EMENDA B", valor_total: 500000.00, empenhado: 0 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "12", resumo: "EMENDA C", valor_total: 500000.00, empenhado: 0 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "13", resumo: "EMENDA D", valor_total: 300000.00, empenhado: 0 }
      - input: ref('fct_receitas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", tipo_receita: "orcamentaria", codigo: "1713.50.1.1.29.00", descricao: "TRANS.SUS PORTARIA PROP 63000759631202600", arrecadado: 2031183.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", tipo_receita: "orcamentaria", codigo: "1713.50.1.1.20.00", descricao: "TRANS.SUS PORTARIA SEM PROPOSTA", arrecadado: 500000.00 }
          - { portal_slug: "outro_portal", ano: 2026, empresa_id: "2", tipo_receita: "orcamentaria", codigo: "1713.50.1.1.20.00", descricao: "OUTRO PORTAL", arrecadado: 300000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759632202600", valor_recebido_fundo: 2031183.00, recebimento_fundo: "confirmado_por_proposta", receita_codigo: "1713.50.1.1.29.00" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "11", valor_recebido_fundo: 0, recebimento_fundo: "valor_igual", receita_codigo: "1713.50.1.1.20.00" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "12", valor_recebido_fundo: 0, recebimento_fundo: "nao_identificado", receita_codigo: null }
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "13", valor_recebido_fundo: 0, recebimento_fundo: "nao_identificado", receita_codigo: null }

  - name: test_emendas_uma_linha_de_receita_confirma_uma_emenda
    description: "Duas emendas de mesmo valor e mesma proposta não confirmam a mesma linha de receita"
    model: fct_emendas
    given:
      - input: ref('int_emendas_consolidadas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759632202600", resumo: "EMENDA A", valor_total: 100000.00, empenhado: 0 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759639999999", resumo: "EMENDA B", valor_total: 100000.00, empenhado: 0 }
      - input: ref('fct_receitas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", tipo_receita: "orcamentaria", codigo: "1713.50.1.1.29.00", descricao: "TRANS.SUS PORTARIA PROP 63000759631202600", arrecadado: 100000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759632202600", valor_recebido_fundo: 100000.00, recebimento_fundo: "confirmado_por_proposta", receita_codigo: "1713.50.1.1.29.00" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, empresa_id: "2", numero_emenda: "63000759639999999", valor_recebido_fundo: 0, recebimento_fundo: "nao_identificado", receita_codigo: null }
