version: 2

models:
  - name: dim_orgao
    description: "Entidades municipais (prefeitura + fundos) por portal"
    config:
      contract:
        enforced: true
    columns:
      - name: orgao_id
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
      - name: orgao_nome
        data_type: text
      - name: cnpj
        data_type: text
        description: "CNPJ oficial do órgão municipal ou null se não cadastrado"
