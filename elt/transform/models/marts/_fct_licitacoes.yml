version: 2

models:
  - name: fct_licitacoes
    description: "Fato de licitações consolidadas de todos os portais"
    config:
      contract:
        enforced: true
    columns:
      - name: licitacao_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | ano | empresa_id | licitacao_numero)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2000
                max_value: 2035
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
      - name: licitacao_numero
        data_type: text
      - name: modalidade
        data_type: text
      - name: objeto
        data_type: text
      - name: discriminacao
        data_type: text
      - name: valor
        data_type: numeric(15, 2)
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "valor is not null"
      - name: valor_estimado
        data_type: numeric(15, 2)
      - name: valor_homologado
        data_type: numeric(15, 2)
      - name: situacao
        data_type: text
      - name: situacao_codigo
        data_type: text
        description: "Situação normalizada: homologada, em_andamento, encerrada, deserta, fracassada, cancelada, classificada ou nao_informada. Valor homologado do PNCP prevalece sobre situação de andamento."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [homologada, em_andamento, encerrada, deserta, fracassada, cancelada, classificada, nao_informada]
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<> 'em_andamento' or coalesce(valor_homologado, 0) = 0"
      - name: data_abertura
        data_type: date
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2010-01-01'::date"
                max_value: "'2040-12-31'::date"
                row_condition: "data_abertura is not null"
      - name: carona
        data_type: text
      - name: fonte_objeto
        data_type: text
        description: "Origem do objeto enriquecido: pncp, contrato_local, tce_rj ou municipal"
      - name: link_sistema_origem
        data_type: text
        description: "Link externo para sala de disputa ou sistema de origem no PNCP"
