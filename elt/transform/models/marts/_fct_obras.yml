version: 2

models:
  - name: fct_obras
    description: "Fato de obras públicas consolidadas do ObrasGov.br"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - portal_slug
            - id_projeto
    columns:
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: id_projeto
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: nome_obra
        data_type: text
      - name: funcao_social
        data_type: text
      - name: descricao_intervencao
        data_type: text
      - name: natureza_intervencao
        data_type: text
      - name: especie_intervencao
        data_type: text
      - name: executor_nome
        data_type: text
      - name: executor_cnpj
        data_type: text
      - name: repassador_nome
        data_type: text
      - name: repassador_cnpj
        data_type: text
      - name: situacao
        data_type: text
      - name: orgao_responsavel
        data_type: text
      - name: valor_investimento_previsto
        data_type: numeric(15, 2)
      - name: valor_total_empenhado_federal
        data_type: numeric(15, 2)
      - name: quantidade_empenhos_federais
        data_type: integer
      - name: percentual_execucao_fisica
        data_type: numeric(5, 2)
      - name: data_ultima_medicao
        data_type: date
      - name: latitude
        data_type: numeric(12, 8)
      - name: longitude
        data_type: numeric(12, 8)
      - name: motivo_paralisacao
        data_type: text
      - name: data_inicio_prevista
        data_type: date
      - name: data_fim_prevista
        data_type: date

  - name: fct_obras_empenhos
    description: "Fato de notas de empenho federais vinculadas a obras públicas (SIAFI / Transferegov.br)"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - portal_slug
            - id_projeto
            - nr_empenho
    columns:
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: id_projeto
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: nr_empenho
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: ug_emitente
        data_type: text
      - name: ano_empenho
        data_type: integer
      - name: valor_empenho
        data_type: numeric(14, 2)
      - name: data_emissao
        data_type: date
      - name: sistema_origem_empenho
        data_type: text
      - name: natureza_despesa
        data_type: text
      - name: fonte
        data_type: text
      - name: programa_trabalho
        data_type: text
      - name: plano_interno
        data_type: text
      - name: acao_orcamentaria
        data_type: text
      - name: descricao_empenho
        data_type: text
