version: 2

models:
  - name: fct_pessoal_decimo_terceiro_mensal
    description: "13º salário pago por mês de empenho e grupo (ativos, inativos_pensionistas), por portal, ano e empresa. Soma igual a fct_pessoal_folha_metricas.pago_13."
    columns:
      - name: pessoal_decimo_terceiro_mensal_id
        description: "Chave substituta de portal_slug, ano, empresa_id, grupo_beneficiario e mes_empenho."
        tests:
          - unique
          - not_null
      - name: portal_slug
        description: "Identificador do portal tenant."
        tests:
          - not_null
      - name: ano
        tests:
          - not_null
      - name: empresa_id
        tests:
          - not_null
      - name: grupo_beneficiario
        description: "ativos (elementos 04, 11, 16, 96) ou inativos_pensionistas (01, 03)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ativos", "inativos_pensionistas"]
      - name: mes_empenho
        description: "Mês (1-12) da data do empenho; nulo quando o empenho não tem data."
      - name: mes_ultimo_registro
        description: "Último mês (1-12) com despesa registrada no portal, ano e empresa; base da comparação com o ano anterior."
      - name: pago_13
        description: "Valor pago de 13º no mês de empenho e grupo."
