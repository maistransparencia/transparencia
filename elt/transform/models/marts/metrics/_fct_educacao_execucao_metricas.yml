version: 2

models:
  - name: fct_educacao_execucao_metricas
    description: "Execução anual da Função 12 (Educação) da Prefeitura por portal e exercício, com pago por aluno da rede municipal (estimativa, só exercício encerrado)"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - portal_slug
            - ano
    columns:
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Slug identificador do portal municipal"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_portais')
                field: portal_slug

      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Exercício de referência"
        tests:
          - not_null

      - name: empenhado_educacao
        data_type: numeric(15, 2)
        description: "Total empenhado no exercício na Função 12 (Educação)"

      - name: liquidado_educacao
        data_type: numeric(15, 2)
        description: "Total liquidado no exercício na Função 12 (Educação)"

      - name: pago_educacao
        data_type: numeric(15, 2)
        description: "Total pago no exercício na Função 12 (Educação)"

      - name: pago_ensino_superior
        data_type: numeric(15, 2)
        description: "Parcela paga na subfunção 364 (Ensino Superior), fora da conta por aluno"

      - name: pago_sem_ensino_superior
        data_type: numeric(15, 2)
        description: "Pago da Função 12 sem a subfunção 364 (Ensino Superior)"

      - name: total_matriculas_rede_municipal
        data_type: integer
        description: "Total de matrículas da rede municipal no Censo Escolar do mesmo ano"

      - name: pago_por_aluno
        data_type: numeric(15, 2)
        description: "Estimativa: pago da Função 12 sem Ensino Superior dividido pelas matrículas da rede municipal do mesmo ano. Nulo no exercício corrente (despesa parcial) e sem matrículas"

unit_tests:
  - name: test_educacao_execucao_pago_por_aluno_sem_ensino_superior
    description: "Pago por aluno exclui a subfunção 364, ignora restos a pagar e isola portais"
    model: fct_educacao_execucao_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, fonte: "exercicio", funcao: "12", subfuncao: "361", empenhado: 1200.00, liquidado: 1100.00, pago: 1000.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, fonte: "exercicio", funcao: "12", subfuncao: "364", empenhado: 300.00, liquidado: 250.00, pago: 200.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, fonte: "restos_a_pagar", funcao: "12", subfuncao: "361", empenhado: 0, liquidado: 0, pago: 999.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, fonte: "exercicio", funcao: "10", subfuncao: "301", empenhado: 50.00, liquidado: 50.00, pago: 50.00 }
          - { portal_slug: "natividade_prefeitura", ano: 2025, fonte: "exercicio", funcao: "12", subfuncao: "361", empenhado: 500.00, liquidado: 500.00, pago: 400.00 }
      - input: ref('seed_censo_escolar_matriculas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", cod_ibge: 3304102, ano: 2025, total_matriculas_rede_municipal: 4 }
          - { portal_slug: "natividade_prefeitura", cod_ibge: 3303104, ano: 2025, total_matriculas_rede_municipal: 0 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenhado_educacao: 1500.00, liquidado_educacao: 1350.00, pago_educacao: 1200.00, pago_ensino_superior: 200.00, pago_sem_ensino_superior: 1000.00, total_matriculas_rede_municipal: 4, pago_por_aluno: 250.00 }
        - { portal_slug: "natividade_prefeitura", ano: 2025, empenhado_educacao: 500.00, liquidado_educacao: 500.00, pago_educacao: 400.00, pago_ensino_superior: 0.00, pago_sem_ensino_superior: 400.00, total_matriculas_rede_municipal: 0, pago_por_aluno: null }

  - name: test_educacao_execucao_pago_por_aluno_exercicio_corrente
    description: "Exercício corrente não calcula pago por aluno"
    model: fct_educacao_execucao_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2999, fonte: "exercicio", funcao: "12", subfuncao: "361", empenhado: 100.00, liquidado: 100.00, pago: 100.00 }
      - input: ref('seed_censo_escolar_matriculas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", cod_ibge: 3304102, ano: 2999, total_matriculas_rede_municipal: 10 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2999, pago_educacao: 100.00, pago_por_aluno: null }
