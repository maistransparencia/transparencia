version: 2

models:
  - name: fct_anomalias_fiscais_metricas
    description: "Motor estatístico automatizado para detecção de anomalias fiscais tempestivas."
    config:
      materialized: "{{ 'view' if var('test_mode', false) else 'table' }}"
    columns:
      - name: anomalia_id
        description: "Chave primária surrogate da anomalia (portal_slug | ano | tipo_anomalia | dimensao_referencia)."
        data_type: text
        tests:
          - unique
          - not_null

      - name: portal_slug
        description: "Identificador do portal/município."
        data_type: text
        tests:
          - not_null

      - name: ano
        description: "Ano de referência da anomalia."
        data_type: integer
        tests:
          - not_null

      - name: tipo_anomalia
        description: "Classificação do tipo de anomalia identificada."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['explosao_comissionados', 'rombo_caixa', 'pico_despesa_homologa', 'concentracao_dispensa', 'opacidade_gastos_genericos']

      - name: dimensao_referencia
        description: "Dimensão temática ou discriminador em snake_case que sofreu a anomalia (ex: saude, educacao, comissionados, recursos_livres, dispensas)."
        data_type: text
        tests:
          - not_null

      - name: grau_severidade
        description: "Grau de severidade da anomalia baseada no desvio."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['critico', 'alto', 'moderado']

      - name: desvio_percentual
        description: "Percentual de desvio em relação ao valor esperado."
        data_type: numeric

      - name: valor_observado
        description: "Valor ou métrica calculada/observada para o ano de referência."
        data_type: numeric

      - name: valor_esperado
        description: "Valor histórico esperado com base na mediana."
        data_type: numeric

      - name: mes_inicial
        description: "Mês inicial da competência temporal ou período acumulado (1 a 12)."
        data_type: integer
        tests:
          - not_null

      - name: mes_final
        description: "Mês final ou competência do snapshot analisado (1 a 12)."
        data_type: integer
        tests:
          - not_null

      - name: deep_link_rota
        description: "Rota canônica de redirecionamento no portal web."
        data_type: text
        tests:
          - not_null

      - name: metodo_deteccao
        description: "Método estatístico utilizado para detectar a anomalia."
        data_type: text
