version: 2

models:
  - name: fct_anomalias_fiscais_metricas
    description: "Motor estatístico automatizado para detecção de anomalias fiscais tempestivas."
    config:
      materialized: "{{ 'view' if var('test_mode', false) else 'table' }}"
    columns:
      - name: anomalia_id
        description: "Chave primária surrogate da anomalia (portal_slug | ano | tipo_anomalia | dimensao_referencia)."
        data_type: text
        tests:
          - unique
          - not_null

      - name: portal_slug
        description: "Identificador do portal/município."
        data_type: text
        tests:
          - not_null

      - name: ano
        description: "Ano de referência da anomalia."
        data_type: integer
        tests:
          - not_null

      - name: tipo_anomalia
        description: "Classificação do tipo de anomalia identificada."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['explosao_comissionados', 'rombo_caixa', 'pico_despesa_homologa', 'concentracao_dispensa', 'opacidade_gastos_genericos', 'inadimplencia_aporte_rpps', 'retencao_patronal_rpps', 'desconto_nulo_pregao', 'desagio_extremo_inexequibilidade', 'inconsistencia_vinculo_pessoal', 'dependencia_transferencias']

      - name: dimensao_referencia
        description: "Dimensão temática ou discriminador em snake_case que sofreu a anomalia (ex: saude, educacao, comissionados, recursos_livres, dispensas, aporte_atuarial, contribuicao_patronal)."
        data_type: text
        tests:
          - not_null

      - name: grau_severidade
        description: "Grau de severidade da anomalia baseada no desvio."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['critico', 'alto', 'moderado']

      - name: desvio_percentual
        description: "Percentual de desvio em relação ao valor esperado."
        data_type: numeric

      - name: valor_observado
        description: "Valor ou métrica calculada/observada para o ano de referência."
        data_type: numeric

      - name: valor_esperado
        description: "Valor histórico esperado com base na mediana."
        data_type: numeric

      - name: mes_inicial
        description: "Mês inicial da competência temporal ou período acumulado (1 a 12)."
        data_type: integer
        tests:
          - not_null

      - name: mes_final
        description: "Mês final ou competência do snapshot analisado (1 a 12)."
        data_type: integer
        tests:
          - not_null

      - name: licitacao_numero
        description: "Número do processo licitatório relacionado à anomalia (preenchido exclusivamente para anomalias de compras públicas)."
        data_type: text

      - name: metodo_deteccao
        description: "Método estatístico utilizado para detectar a anomalia."
        data_type: text

unit_tests:
  - name: test_fct_anomalias_fiscais_caprem_atuarial_e_patronal
    description: "Valida deteccao de anomalias previdenciarias de aporte atuarial e retencao patronal"
    model: fct_anomalias_fiscais_metricas
    given:
      - input: ref('fct_despesas')
        rows: []
      - input: ref('fct_pessoal_regime_metricas')
        rows: []
      - input: ref('fct_saldo_caixa_siconfi')
        rows: []
      - input: ref('fct_licitacoes')
        rows: []
      - input: ref('fct_opacidade_contabil_metricas')
        rows: []
      - input: ref('fct_caprem_tendencia_atuarial_metricas')
        rows:
          # Inadimplencia critica (< 70% adimplencia => desvio > 30%)
          - { portal_slug: "porciuncula_prefeitura", ano: 2024, aporte_exigido: 1000000.00, aporte_quitado: 650000.00, taxa_adimplencia: 65.00, amortizacao_divida: 0.00 }
          # Inadimplencia alta (70% <= adimplencia < 90% => desvio <= 30%)
          - { portal_slug: "porciuncula_prefeitura", ano: 2023, aporte_exigido: 500000.00, aporte_quitado: 400000.00, taxa_adimplencia: 80.00, amortizacao_divida: 0.00 }
          # Adimplente (>= 90% adimplencia) -> deve ser ignorado
          - { portal_slug: "porciuncula_prefeitura", ano: 2022, aporte_exigido: 800000.00, aporte_quitado: 760000.00, taxa_adimplencia: 95.00, amortizacao_divida: 0.00 }
          # Sem aporte exigido -> deve ser ignorado
          - { portal_slug: "porciuncula_prefeitura", ano: 2021, aporte_exigido: 0.00, aporte_quitado: 0.00, taxa_adimplencia: 100.00, amortizacao_divida: 0.00 }
      - input: ref('fct_historia_caprem_metricas')
        rows:
          # Retencao patronal critica (> 20.000)
          - { portal_slug: "porciuncula_prefeitura", ano: 2024, rombo_patronal_nao_repassado: 50000.00 }
          # Retencao residual (<= 20.000) -> deve ser ignorado
          - { portal_slug: "porciuncula_prefeitura", ano: 2023, rombo_patronal_nao_repassado: 5000.00 }
      - input: ref('fct_licitacoes_itens')
        rows: []
      - input: ref('fct_pessoal')
        rows: []
      - input: ref('fct_fontes_receita_metricas')
        rows: []
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2024, tipo_anomalia: "inadimplencia_aporte_rpps", dimensao_referencia: "aporte_atuarial", grau_severidade: "critico", desvio_percentual: 35.00, valor_observado: 650000.00, valor_esperado: 1000000.00, mes_inicial: 1, mes_final: 12, licitacao_numero: null, metodo_deteccao: "limite_normativo_adimplencia" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2024, tipo_anomalia: "retencao_patronal_rpps", dimensao_referencia: "contribuicao_patronal", grau_severidade: "critico", desvio_percentual: 100.00, valor_observado: 50000.00, valor_esperado: 0.00, mes_inicial: 1, mes_final: 12, licitacao_numero: null, metodo_deteccao: "fluxo_patronal_em_aberto" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2023, tipo_anomalia: "inadimplencia_aporte_rpps", dimensao_referencia: "aporte_atuarial", grau_severidade: "alto", desvio_percentual: 20.00, valor_observado: 400000.00, valor_esperado: 500000.00, mes_inicial: 1, mes_final: 12, licitacao_numero: null, metodo_deteccao: "limite_normativo_adimplencia" }

  - name: test_fct_anomalias_fiscais_licitacoes_pncp
    description: "Valida deteccao de anomalias licitatorias de desconto nulo em pregao e desagio extremo"
    model: fct_anomalias_fiscais_metricas
    given:
      - input: ref('fct_despesas')
        rows: []
      - input: ref('fct_pessoal_regime_metricas')
        rows: []
      - input: ref('fct_saldo_caixa_siconfi')
        rows: []
      - input: ref('fct_opacidade_contabil_metricas')
        rows: []
      - input: ref('fct_caprem_tendencia_atuarial_metricas')
        rows: []
      - input: ref('fct_historia_caprem_metricas')
        rows: []
      - input: ref('fct_pessoal')
        rows: []
      - input: ref('fct_fontes_receita_metricas')
        rows: []
      - input: ref('fct_licitacoes')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000517", modalidade: "Pregão Eletrônico" }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000290", modalidade: "Pregão Eletrônico" }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000100", modalidade: "Pregão Eletrônico" }
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000200", modalidade: "Pregão Eletrônico" }
      - input: ref('fct_licitacoes_itens')
        rows:
          # Desconto nulo em pregao (homologado R$ 50.000, desconto 0.00%) -> anomalia critica
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000517", numero_item: 1, valor_total_estimado: 50000.00, valor_total_homologado: 50000.00 }
          # Desagio extremo (estimado R$ 100.000, homologado R$ 30.000 => desconto 70.00%) -> anomalia critica
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000290", numero_item: 1, valor_total_estimado: 100000.00, valor_total_homologado: 30000.00 }
          # Competitiva normal (desconto 20.00%) -> sem anomalia
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000100", numero_item: 1, valor_total_estimado: 50000.00, valor_total_homologado: 40000.00 }
          # Desconto nulo mas abaixo da materialidade (< 20.000) -> sem anomalia
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, licitacao_numero: "000200", numero_item: 1, valor_total_estimado: 5000.00, valor_total_homologado: 5000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, tipo_anomalia: "desconto_nulo_pregao", dimensao_referencia: "licitacao_000517", grau_severidade: "critico", desvio_percentual: 10.00, valor_observado: 0.00, valor_esperado: 10.00, mes_inicial: 1, mes_final: 12, licitacao_numero: "000517", metodo_deteccao: "limite_competitividade_pregao" }
        - { portal_slug: "porciuncula_prefeitura", ano: 2026, tipo_anomalia: "desagio_extremo_inexequibilidade", dimensao_referencia: "licitacao_000290", grau_severidade: "critico", desvio_percentual: 20.00, valor_observado: 70.00, valor_esperado: 50.00, mes_inicial: 1, mes_final: 12, licitacao_numero: "000290", metodo_deteccao: "limite_inexequibilidade_art59" }

