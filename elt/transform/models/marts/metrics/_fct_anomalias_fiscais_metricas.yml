  - name: test_fct_anomalias_fiscais_dependencia_transferencias
    description: "Valida deteccao de anomalias de dependencia de transferencias sob Art. 11 da LRF para anos fechados"
    model: fct_anomalias_fiscais_metricas
    given:
      - input: ref('fct_despesas')
        rows: []
      - input: ref('fct_pessoal_regime_metricas')
        rows: []
      - input: ref('fct_saldo_caixa_siconfi')
        rows: []
      - input: ref('fct_licitacoes')
        rows: []
      - input: ref('fct_opacidade_contabil_metricas')
        rows: []
      - input: ref('fct_caprem_tendencia_atuarial_metricas')
        rows: []
      - input: ref('fct_historia_caprem_metricas')
        rows: []
      - input: ref('fct_licitacoes_itens')
        rows: []
      - input: ref('fct_pessoal')
        rows: []
      - input: ref('fct_fontes_receita_metricas')
        rows:
          # 2024: ano fechado com receita propria 5% (< 10% => anomalia critica)
          - { portal_slug: "porciuncula_prefeitura", ano: 2024, total_arrecadado: 1000000.00, receita_propria_arrecadado: 50000.00, total_previsto: 1000000.00, receita_propria_previsto: 50000.00 }
          # 2023: ano fechado com receita propria 15% (>= 10% => sem anomalia)
          - { portal_slug: "porciuncula_prefeitura", ano: 2023, total_arrecadado: 1000000.00, receita_propria_arrecadado: 150000.00, total_previsto: 1000000.00, receita_propria_previsto: 150000.00 }
          # 2026: ano corrente em andamento com 4% (< 10% mas corrente => sem anomalia)
          - { portal_slug: "porciuncula_prefeitura", ano: 2026, total_arrecadado: 1000000.00, receita_propria_arrecadado: 40000.00, total_previsto: 1000000.00, receita_propria_previsto: 40000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2024, tipo_anomalia: "dependencia_transferencias", dimensao_referencia: "receita_propria", grau_severidade: "critico", desvio_percentual: 5.00, valor_observado: 5.00, valor_esperado: 10.00, mes_inicial: 1, mes_final: 12, licitacao_numero: null, metodo_deteccao: "art11_lrf_arrecadacao_propria" }
