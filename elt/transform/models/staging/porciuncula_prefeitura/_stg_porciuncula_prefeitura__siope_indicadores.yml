version: 2

models:
  - name: stg_porciuncula_prefeitura__siope_indicadores
    description: "Indicadores do SIOPE de porciuncula_prefeitura — casts e limpeza de texto"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [portal_slug, ano, periodo, codigo_indicador]
    columns:
      - name: portal_slug
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['porciuncula_prefeitura']
      - name: ano
        data_type: integer
        tests:
          - not_null
      - name: periodo
        data_type: integer
        tests:
          - not_null
      - name: tipo_periodo
        data_type: text
      - name: codigo_indicador
        data_type: text
        tests:
          - not_null
      - name: unidade
        data_type: text
      - name: valor
        data_type: numeric
      - name: coletado_em
        data_type: timestamp with time zone
