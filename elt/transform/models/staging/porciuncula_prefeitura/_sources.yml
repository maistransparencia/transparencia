          - name: insmf
          - name: cepci
          - name: empenhado
          - name: liquidado
          - name: pago

      - name: despesas_restos_pagar
        description: "Restos a pagar de exercícios anteriores"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
