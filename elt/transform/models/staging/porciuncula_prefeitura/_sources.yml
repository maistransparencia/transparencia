          - name: arrec_total

      - name: receita_estado
        description: "Transferências recebidas do Estado"
        meta:
          primary_key: [ano, empresa, codigo]
        columns:
          - name: ano
          - name: empresa
          - name: codigo
          - name: descricao
          - name: nome
          - name: especificacao
          - name: previsto
          - name: arrecadado
          - name: previsao_atualizada
          - name: prev_atualizada
          - name: arrecadado_total
          - name: arrec_total

      - name: receita_extra_orcamentaria
        description: "Receitas extra-orçamentárias"
        meta:
          primary_key: [ano, empresa, codigo, dtlan, descricao, valor]
        columns:
          - name: ano
          - name: empresa
          - name: codigo
          - name: descricao
          - name: valor
          - name: dtlan
          - name: empresanome

      - name: licitacoes
        description: "Processos licitatórios"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
          - name: ano
          - name: empresa
          - name: numero
          - name: licit
          - name: modalidade
          - name: discr
          - name: objeto
          - name: discr10
          - name: valor
          - name: situacao
          - name: datae
          - name: carona
          - name: licitacao
          - name: proclic

      - name: contratos
        description: "Contratos celebrados"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
          - name: ano
          - name: empresa
          - name: numero
          - name: fornecedor
          - name: objeto
          - name: valor
          - name: valcon
          - name: licitacao_numero
          - name: modali
          - name: mes
          - name: tipocoobra
          - name: numobra
          - name: fundlegal
          - name: empenhado
          - name: data_inicio
          - name: data_fim
          - name: vencimento_atual
          - name: objeto_completo
          - name: saldoempenhar
          - name: aditado
          - name: insmf

      - name: diarias
        description: "Diárias pagas a servidores"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
          - name: ano
          - name: empresa
          - name: numero
          - name: valor
          - name: favorecido
          - name: cargo
          - name: data
          - name: unidade
          - name: descricao

      - name: emendas_impositivas
        description: "Emendas parlamentares impositivas"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
          - name: ano
          - name: empresa
          - name: numero
          - name: descricao
          - name: valor

      - name: emendas_cad
        description: "Cadastro detalhado de emendas"
        meta:
          primary_key: [ano, empresa, numero]
        columns:
          - name: ano
          - name: empresa
          - name: numero
          - name: numero_emenda
          - name: resumo
          - name: valor_total
          - name: empenhado
          - name: autor
          - name: tipo_emenda_descr
          - name: esfera_origem
          - name: ato_normativo
          - name: destinacao_descr
          - name: pk_ep_emenda

      - name: pessoal
        description: "Folha de pessoal"
        meta:
          primary_key: [ano, empresa, mes, matricula]
        columns:
          - name: ano
          - name: empresa
          - name: mes
          - name: matricula
          - name: nome
          - name: cargo
          - name: proventos
          - name: remuneracao
          - name: categoriafuncional
          - name: vinculo
          - name: formaprovimento
          - name: tiporegime
          - name: tipocontrato
          - name: situacaofuncional
          - name: referencia_nome

      - name: transferencias
        description: "Transferências a terceiros"
        meta:
          primary_key: [ano, empresa, codigo]
        columns:
          - name: ano
          - name: empresa
          - name: codigo
          - name: mes
          - name: entidade_pagadora
          - name: entidade_recebedora
          - name: repasse
          - name: devolucao

      - name: metadata
        description: "Metadados do pipeline ELT (ex: data da última extração)"
        meta:
          primary_key: [portal_slug, key]
        columns:
          - name: portal_slug
          - name: key
          - name: value

      - name: empresas
        description: "Entidades/órgãos do portal"
        meta:
          primary_key: [id]
        columns:
          - name: id
            data_type: integer
          - name: nome

      - name: siconfi_msc_patrimonial
        description: "Matriz de Saldos Contábeis (MSC) Patrimonial - Classe 1 (Caixa, Bancos e Aplicações Financeiras) do SICONFI/STN"
        meta:
          primary_key: [ano, mes_referencia, cod_ibge, conta_contabil, poder_orgao, fonte_recursos, ano_fonte_recursos, financeiro_permanente, tipo_valor, natureza_conta]
        columns:
          - name: ano
          - name: mes_referencia
          - name: cod_ibge
          - name: tipo_matriz
          - name: classe_conta
          - name: conta_contabil
          - name: poder_orgao
          - name: financeiro_permanente
          - name: ano_fonte_recursos
          - name: fonte_recursos
          - name: valor
          - name: natureza_conta
          - name: tipo_valor
          - name: data_referencia
          - name: data_extracao

  - name: raw_pncp
    schema: raw_pncp
    description: "Dados brutos extraídos da API do Portal Nacional de Contratações Públicas (PNCP)"
    tables:
      - name: compras
        description: "Contratações e compras públicas publicadas no PNCP"
        meta:
          primary_key: [numero_controle_pncp]
        columns:
          - name: numero_controle_pncp
          - name: cnpj_orgao
          - name: ano_compra
          - name: sequencial_compra
          - name: numero_compra
          - name: processo
          - name: objeto_compra
          - name: link_sistema_origem
          - name: modalidade_id
          - name: modalidade_nome
          - name: situacao_compra_id
          - name: situacao_compra_nome
          - name: data_publicacao_pncp
          - name: data_abertura_proposta
          - name: valor_total_estimado
          - name: valor_total_homologado
          - name: informacao_complementar
          - name: srp
          - name: data_extracao

      - name: itens
        description: "Itens de compras e processos licitatórios do PNCP"
        meta:
          primary_key: [numero_controle_pncp, numero_item]
        columns:
          - name: numero_controle_pncp
          - name: cnpj_orgao
          - name: ano_compra
          - name: sequencial_compra
          - name: numero_compra
          - name: numero_item
          - name: descricao
          - name: material_ou_servico
          - name: quantidade
          - name: unidade_medida
          - name: valor_unitario_estimado
          - name: valor_total_estimado
          - name: situacao_item
          - name: criterio_julgamento
          - name: data_extracao

      - name: itens_resultados
        description: "Resultados homologados e adjudicados de itens do PNCP"
        meta:
          primary_key: [numero_controle_pncp, numero_item, sequencial_resultado]
        columns:
          - name: numero_controle_pncp
          - name: cnpj_orgao
          - name: ano_compra
          - name: sequencial_compra
          - name: numero_item
          - name: sequencial_resultado
          - name: fornecedor_cnpj_cpf
          - name: fornecedor_nome
          - name: valor_unitario_homologado
          - name: valor_total_homologado
          - name: percentual_desconto
          - name: situacao_resultado
          - name: data_resultado
          - name: data_extracao
