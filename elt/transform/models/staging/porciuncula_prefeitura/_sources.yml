          - name: produ
          - name: nomeempresa
          - name: proc
          - name: codlo
          - name: cfpro
          - name: ficha
          - name: codif
          - name: codigo
          - name: vingrupo_vincodigo
          - name: vincodigonome

      - name: despesas_por_orgao
        description: "Despesas agregadas por órgão/secretaria"
        meta:
          primary_key: [ano, empresa, codigo]
        columns:
          - name: empresa
          - name: ano
          - name: codigo
          - name: descricao
          - name: empenhado
          - name: liquidado
          - name: pago
          - name: dotac
          - name: altdo
          - name: dotacao_atualizada

      - name: despesas_por_unidade
        description: "Despesas agregadas por unidade orçamentária"
        meta:
