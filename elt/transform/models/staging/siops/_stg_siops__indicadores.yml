version: 2

models:
  - name: stg_siops__indicadores
    description: "Indicadores do SIOPS de todos os portais, no grão portal + ano + período + via + indicador — casts e limpeza de texto. Valor nulo é sem dado, nunca zero"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [portal_slug, ano, periodo, via, codigo_indicador]
    columns:
      - name: portal_slug
        data_type: text
        tests:
          - not_null
      - name: ano
        data_type: integer
        tests:
          - not_null
      - name: periodo
        data_type: integer
        tests:
          - not_null
      - name: tipo_periodo
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: [anual, bimestral]
      - name: via
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: [tabnet, consulta_ano]
      - name: codigo_indicador
        data_type: text
        tests:
          - not_null
      - name: unidade
        data_type: text
      - name: valor
        data_type: numeric
      - name: coletado_em
        data_type: timestamp with time zone
