version: 2

models:
  - name: stg_fiorilli__receita_extra_orcamentaria
    description: "Receitas extra-orçamentárias de todos os portais Fiorilli — casts e renomeação de colunas"
    columns:
      - name: portal_slug
        data_type: text
        tests:
          - not_null
      - name: ano
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 2015
                max_value: 2035
      - name: empresa_id
        data_type: text
        tests:
          - not_null
      - name: codigo
        data_type: text
      - name: descricao
        data_type: text
      - name: valor_arrecadado
        data_type: numeric
      - name: data_lancamento
        data_type: text
      - name: empresa_nome
        data_type: text
