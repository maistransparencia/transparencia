version: 2

models:
  - name: stg_coletas__registro_coletas
    description: "Registro de coletas por fonte com coletado_em convertido para timestamptz"
    columns:
      - name: portal_slug
        tests:
          - not_null
      - name: fonte
        tests:
          - not_null
      - name: coletado_em
        tests:
          - not_null
      - name: resultado
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [sucesso, falha]
      - name: erro_codigo
        tests:
          - accepted_values:
              arguments:
                values: [fonte_fora_do_ar, formato_mudou, resposta_vazia_suspeita, erro_inesperado]
