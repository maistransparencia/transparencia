version: 2

models:
  - name: stg_inep__ideb
    description: "Camada de staging com dados normalizados do IDEB, Saeb e fluxo escolar por município e etapa de ensino (INEP/MEC)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cod_ibge
            - ano
            - rede
            - etapa_ensino
    columns:
      - name: cod_ibge
        description: "Código IBGE de 7 dígitos do município"
        tests:
          - not_null

      - name: ano
        description: "Ano do ciclo bienal de avaliação (ex: 2021, 2023, 2025)"
        tests:
          - not_null

      - name: rede
        description: "Dependência administrativa em lowercase snake_case (municipal, estadual, publica)"
        tests:
          - not_null
          - accepted_values:
              values: ['municipal', 'estadual', 'publica']

      - name: etapa_ensino
        description: "Etapa de ensino fundamental em lowercase snake_case (anos_iniciais, anos_finais)"
        tests:
          - not_null
          - accepted_values:
              values: ['anos_iniciais', 'anos_finais']

      - name: nota_ideb
        description: "Nota oficial observada do IDEB no ciclo bienal (0 a 10)"

      - name: meta_ideb
        description: "Meta projetada do IDEB estabelecida pelo MEC/INEP para o ciclo"

      - name: saeb_matematica
        description: "Média padronizada Saeb em Matemática"

      - name: saeb_lingua_portuguesa
        description: "Média padronizada Saeb em Língua Portuguesa"

      - name: taxa_aprovacao
        description: "Indicador de rendimento / taxa de aprovação apurado pelo Censo Escolar"
