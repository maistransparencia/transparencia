version: 2

seeds:
  - name: seed_porciuncula_prefeitura_orgaos
    description: "Entidades municipais de Porciúncula (prefeitura + fundos)"
    config:
      column_types:
        portal_slug: text
        empresa_id: text
        nome: text
        cnpj: text

  - name: seed_natividade_prefeitura_orgaos
    description: "Entidades municipais de Natividade"
    config:
      column_types:
        portal_slug: text
        empresa_id: text
        nome: text
        cnpj: text

  - name: seed_porciuncula_prefeitura_siconfi_orgaos
    description: "Vínculo entre grupos de destinação contábil da MSC SICONFI e órgãos de Porciúncula"
    config:
      column_types:
        portal_slug: text
        poder_orgao: text
        grupo_destinacao: text
        empresa_id: text
        descricao: text

  - name: seed_natividade_prefeitura_siconfi_orgaos
    description: "Vínculo entre grupos de destinação contábil da MSC SICONFI e órgãos de Natividade"
    config:
      column_types:
        portal_slug: text
        poder_orgao: text
        grupo_destinacao: text
        empresa_id: text
        descricao: text

  - name: seed_portais
    description: "Configurações e metadados dos portais de transparência"
    config:
      column_types:
        portal_slug: text
        display_name: text
        uf: text
        portal_url: text
        base_host: text
        cidade_clean: text
        ano_inicial: integer
        empresa_padrao: text
        brasao_asset: text
        previdencia_habilitado: boolean
        previdencia_sigla: text
        previdencia_nome: text
        previdencia_cnpj: text
        highlights_json: text
        cod_ibge: integer
        plano_saude_habilitado: boolean
        plano_saude_nome: text
        plano_saude_sigla: text
        plano_saude_cnpj: text

  - name: seed_elemento_despesa
    description: "Catálogo exaustivo oficial de 99 elementos de despesa (STN/MCASP)"
    config:
      column_types:
        elemento_codigo: text
        elemento_descricao: text
        categoria_macro: text

  - name: seed_natureza_despesa
    description: "Catálogo oficial da estrutura de natureza de despesa (Portaria STN/SOF nº 163/2001)"
    config:
      column_types:
        natureza_despesa_codigo: text
        categoria_economica_codigo: text
        categoria_economica_nome: text
        gnd_codigo: text
        gnd_nome: text
        modalidade_codigo: text
        modalidade_nome: text

  - name: seed_funcao_subfuncao
    description: "Catálogo oficial de funções e subfunções orçamentárias (Portaria MOG nº 42/1999)"
    config:
      column_types:
        funcao_subfuncao_codigo: text
        funcao_codigo: text
        funcao_nome: text
        subfuncao_codigo: text
        subfuncao_nome: text

  - name: seed_constantes_fiscais
    description: "Tabela SSOT de constantes fiscais e limites regulatórios por ano (Lei 14.133/2021, LRF, STN)"
    config:
      column_types:
        dominio: text
        chave: text
        ano_inicio: integer
        ano_fim: integer
        valor_num: numeric
        valor_txt: text
        descricao: text
        base_legal: text
        url_base_legal: text

  - name: seed_fontes_recursos_stn
    description: "Catálogo oficial de fontes de recursos padronizadas nacionalmente (Portaria STN nº 710/2021 e códigos legados). Origem: Anexo I da Portaria STN nº 710/2021 consolidada pelo Tesouro Nacional até a Portaria STN/MF nº 1.701 de 04/08/2025 (códigos de 4 dígitos: 1 dígito do exercício mais a fonte padronizada de 3 dígitos), conferida em 23/10/2026; códigos de 8 dígitos legados (padrão anterior a 2021, 4 dígitos de fonte mais 4 de detalhamento) foram conferidos em 23/10/2026 contra as naturezas de receita lançadas em cada fonte pelos portais, e os que nenhum portal usa não foram revisados. Coerência com os portais verificada por seed_fontes_recursos_stn_referencia_portais."
    config:
      column_types:
        codigo_fonte: text
        descricao: text
        grupo_destinacao: text
        recurso_vinculado_flag: boolean

  - name: seed_fontes_recursos_stn_referencia_portais
    description: "Pares fonte e descrição observados nos portais, usados pelos testes de coerência com seed_fontes_recursos_stn. conferido indica se o par foi confirmado (códigos de 4 dígitos contra a Portaria STN; legados de 8 dígitos contra a natureza de receita que o portal lança na fonte); os demais geram aviso, não falha."
    config:
      column_types:
        codigo_fonte_stn: text
        descricao_portal: text
        palavra_chave: text
        conferido: boolean

  - name: seed_pncp_licitacoes_mapeamento
    description: "Mapeamento determinístico auditado entre licitações municipais e compras do PNCP"
    config:
      column_types:
        portal_slug: text
        ano: integer
        licitacao_numero: text
        ano_compra: integer
        sequencial_compra: integer
        confianca: text

  - name: seed_inep_ideb
    description: "Série histórica oficial e recente do IDEB, proficiências Saeb e fluxo escolar por município (INEP/MEC)"
    config:
      column_types:
        cod_ibge: integer
        ano: integer
        rede: text
        etapa_ensino: text
        nota_ideb: numeric
        meta_ideb: numeric
        saeb_matematica: numeric
        saeb_lingua_portuguesa: numeric
        taxa_aprovacao: numeric

  - name: seed_inep_ideb_estados
    description: "Série histórica oficial das notas do IDEB por Unidade da Federação e etapa de ensino (INEP/MEC)"
    config:
      column_types:
        cod_uf: integer
        sigla_uf: text
        ano: integer
        rede: text
        etapa_ensino: text
        nota_ideb: numeric

  - name: seed_censo_escolar_matriculas
    description: "Série histórica de matrículas ativas da rede municipal de ensino apuradas pelo Censo Escolar (INEP/MEC)"
    config:
      column_types:
        portal_slug: text
        cod_ibge: integer
        ano: integer
        total_matriculas_rede_municipal: integer
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - portal_slug
            - ano
    columns:
      - name: portal_slug
        description: "Slug identificador do portal municipal"
        tests:
          - not_null
      - name: cod_ibge
        description: "Código IBGE de 7 dígitos do município"
        tests:
          - not_null
      - name: ano
        description: "Exercício do Censo Escolar"
        tests:
          - not_null
      - name: total_matriculas_rede_municipal
        description: "Total oficial de matrículas ativas da rede municipal"
        tests:
          - not_null


