name: Contrato FTP DATASUS (temporario)

on:
  push:
    branches: [feature/epic25-story-25-6]
    paths: [.github/workflows/contrato-ftp-datasus.yml]
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install uv
          uv sync --project elt --no-dev
      - name: Espaço em disco antes
        run: df -h / | tail -1
      - name: Medir o FTP
        run: PYTHONPATH=. uv run --project elt python elt/scripts/contrato_ftp_datasus.py --competencia 202512 --repeticoes 3
      - name: Espaço em disco depois
        run: df -h / | tail -1
