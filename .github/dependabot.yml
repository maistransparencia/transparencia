version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: "auto"
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/elt"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip-dependencies:
        patterns:
          - "*"
